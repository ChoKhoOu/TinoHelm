<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QDS — 策略管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--font-d:'IBM Plex Mono',monospace;--font-u:'IBM Plex Sans',sans-serif;--eo:cubic-bezier(.16,1,.3,1);--dur:280ms;--r:12px;--rs:6px;--bg-p:#302f2d;--bg-s:#262624;--bg-t:#3b3a37;--bg-in:#141413;--t0:#E8E6E0;--t1:#9C9A92;--t2:#73726C;--t3:#5F5E5A;--bd:#3b3a37;--bdh:#5F5E5A;--acc:#D97857;--acc-d:rgba(217,120,87,.12);--suc:#36884B;--suc-d:rgba(54,136,75,.12);--dan:#FE8181;--dan-d:rgba(254,129,129,.12);--info:#85B7EB;--info-d:rgba(133,183,235,.12);--warn:#FAC775;--warn-d:rgba(250,199,117,.12)}
html.light{--bg-p:#f5f4ed;--bg-s:#faf9f5;--bg-t:#eae8e0;--bg-in:#fcfbf8;--t0:#2C2C2A;--t1:#73726C;--t2:#9C9A92;--t3:#B0ADA5;--bd:#dedbd3;--bdh:#c7c4bb;--acc:#D97857;--acc-d:rgba(217,120,87,.08);--suc:#36884B;--suc-d:rgba(54,136,75,.08);--dan:#8A2425;--dan-d:rgba(138,36,37,.08);--info:#3266AD;--info-d:rgba(50,102,173,.08);--warn:#854F0B}
body{background:var(--bg-s);color:var(--t0);font-family:var(--font-u);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background var(--dur) var(--eo)}
.page{max-width:960px;margin:0 auto;padding:1.5rem 2rem 6rem}
.mono{font-family:var(--font-d)}.dim{color:var(--t2)}.cg{color:var(--suc)}.cr{color:var(--dan)}.ca{color:var(--acc)}

/* Top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 0;border-bottom:1px solid var(--bd);margin-bottom:1.5rem}
.topbar h1{font-family:var(--font-d);font-size:1.05rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.topbar .dot{color:var(--acc)}
.topbar .cnt{font-size:.72rem;color:var(--t2);font-weight:400}
.top-r{display:flex;align-items:center;gap:.5rem}
.btn-p{font-family:var(--font-d);font-size:.72rem;padding:.4rem .85rem;border-radius:var(--rs);border:1px solid var(--acc);background:var(--acc-d);color:var(--acc);cursor:pointer;transition:all 150ms var(--eo);display:flex;align-items:center;gap:.35rem}
.btn-p:hover{background:var(--acc);color:#fff}
.btn-g{font-family:var(--font-d);font-size:.72rem;padding:.4rem .85rem;border-radius:var(--rs);border:1px solid var(--bd);background:0;color:var(--t1);cursor:pointer;transition:all 150ms var(--eo)}
.btn-g:hover{border-color:var(--bdh);color:var(--t0);background:var(--bg-t)}
.tbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);background:0;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.72rem;transition:all 150ms}
.tbtn:hover{border-color:var(--bdh);color:var(--t0);background:var(--bg-t)}

/* Search */
.search-bar{margin-bottom:1.25rem}
.search-input{width:100%;max-width:320px;padding:.45rem .75rem;font-family:var(--font-d);font-size:.75rem;background:var(--bg-p);border:1px solid var(--bd);border-radius:var(--rs);color:var(--t0);outline:0;transition:border-color 200ms}
.search-input::placeholder{color:var(--t3)}
.search-input:focus{border-color:var(--acc)}

/* List */
.list{background:var(--bg-p);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:3px 1fr auto auto auto;align-items:center;border-bottom:1px solid var(--bd);cursor:pointer;transition:background 150ms}
.row:last-child{border-bottom:0}
.row:hover{background:var(--bg-t)}
.row-acc{width:3px;align-self:stretch;border-radius:2px 0 0 2px}
.row-info{padding:.75rem 1rem}
.row-name{font-family:var(--font-d);font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.row-meta{font-size:.68rem;color:var(--t2);margin-top:.1rem;font-family:var(--font-d)}
.row-col{padding:.75rem .65rem;font-family:var(--font-d);font-size:.72rem}
.row-arrow{padding:.75rem .85rem .75rem 0;color:var(--t3);font-size:.72rem;transition:all 150ms}
.row:hover .row-arrow{color:var(--acc);transform:translateX(3px)}
.badge{font-family:var(--font-d);font-size:.58rem;padding:.12rem .4rem;border-radius:100px}
.badge-type{background:var(--bg-t);color:var(--t1)}

/* View transitions */
#listView,#detailView{transition:opacity .35s var(--eo),transform .35s var(--eo)}
#listView.hide{opacity:0;transform:translateX(-30px);pointer-events:none;position:absolute;width:100%}
#detailView{display:none;opacity:0;transform:translateX(30px)}
#detailView.show{display:block;opacity:1;transform:translateX(0)}

/* Detail */
.dh{display:flex;align-items:center;gap:1rem;padding-bottom:1.25rem;border-bottom:1px solid var(--bd);margin-bottom:1.5rem;flex-wrap:wrap}
.back-btn{font-family:var(--font-d);font-size:.75rem;padding:.4rem .75rem;border-radius:var(--rs);border:1px solid var(--bd);background:0;color:var(--t1);cursor:pointer;transition:all 150ms;display:flex;align-items:center;gap:.35rem}
.back-btn:hover{border-color:var(--bdh);color:var(--t0);background:var(--bg-t)}
.back-btn:hover .ba{transform:translateX(-3px)}
.ba{transition:transform 150ms}
.dh-icon{width:40px;height:40px;border-radius:10px;background:var(--acc-d);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:.82rem;font-weight:600;color:var(--acc);flex-shrink:0}
.dh-title{font-family:var(--font-d);font-size:1.05rem;font-weight:600}
.dh-path{font-family:var(--font-d);font-size:.68rem;color:var(--t2);margin-top:.1rem}
.dh-actions{margin-left:auto;display:flex;gap:.4rem}

/* Sections */
.sec{margin-bottom:2rem}
.sl{font-family:var(--font-d);font-size:.56rem;letter-spacing:.15em;text-transform:uppercase;color:var(--acc);margin-bottom:.65rem;display:flex;align-items:center;gap:.5rem}
.sl::after{content:'';flex:1;height:1px;background:var(--bd)}
.sec-enter{opacity:0;transform:translateY(16px);transition:opacity .45s var(--eo),transform .45s var(--eo)}
.sec-enter.v{opacity:1;transform:translateY(0)}
.sec-enter:nth-child(2){transition-delay:.05s}.sec-enter:nth-child(3){transition-delay:.1s}.sec-enter:nth-child(4){transition-delay:.15s}.sec-enter:nth-child(5){transition-delay:.2s}

/* Info grid */
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
.info-item{background:var(--bg-p);border:1px solid var(--bd);border-radius:var(--rs);padding:.65rem .85rem;transition:border-color 150ms}
.info-item:hover{border-color:var(--bdh)}
.info-label{font-size:.6rem;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.2rem}
.info-val{font-family:var(--font-d);font-size:.8rem;font-weight:500}

/* Param table */
.cd{background:var(--bg-p);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;transition:border-color 150ms}
.cd:hover{border-color:var(--bdh)}
.ptbl{width:100%;border-collapse:collapse;font-family:var(--font-d);font-size:.72rem}
.ptbl thead th{padding:.5rem .7rem;text-align:left;font-weight:500;font-size:.6rem;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bd)}
.ptbl thead th.tr{text-align:right}
.ptbl tbody tr{border-bottom:1px solid var(--bd);transition:background 150ms}
.ptbl tbody tr:last-child{border-bottom:0}
.ptbl tbody tr:hover{background:var(--bg-t)}
.ptbl td{padding:.5rem .7rem;vertical-align:middle}
.ptbl td.tr{text-align:right}
.pname{font-weight:500}
.ptype{font-size:.58rem;padding:.1rem .35rem;border-radius:3px;display:inline-block}
.pval{font-weight:500}
.prange{display:flex;align-items:center;gap:.3rem;justify-content:flex-end}
.prange-input{width:52px;padding:.25rem .4rem;font-family:var(--font-d);font-size:.68rem;background:var(--bg-in);border:1px solid var(--bd);border-radius:4px;color:var(--t0);outline:0;text-align:right;transition:border-color 200ms}
.prange-input:focus{border-color:var(--acc)}

/* Version timeline */
.vtl{position:relative;padding-left:1.5rem}
.vtl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--bd)}
.vtl-item{position:relative;padding-bottom:1.25rem}
.vtl-item:last-child{padding-bottom:0}
.vtl-dot{position:absolute;left:-1.5rem;top:5px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bd);background:var(--bg-s)}
.vtl-item:first-child .vtl-dot{border-color:var(--acc);background:var(--acc)}
.vtl-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem}
.vtl-ver{font-family:var(--font-d);font-size:.75rem;font-weight:600}
.vtl-date{font-family:var(--font-d);font-size:.62rem;color:var(--t3)}
.vtl-msg{font-size:.72rem;color:var(--t2);line-height:1.5}
.vtl-tag{font-size:.56rem;padding:.08rem .3rem;border-radius:3px}

@media(max-width:700px){.info-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="page">

<!-- ===== LIST VIEW ===== -->
<div id="listView">
  <div class="topbar">
    <h1>策略管理<span class="cnt" id="stratCount">· 5 个策略</span></h1>
    <div class="top-r">
      <button class="btn-p">+ 新建策略</button>
      <button class="btn-g">↻ 重新扫描</button>
      <button class="tbtn" onclick="document.documentElement.classList.toggle('light')">◑</button>
    </div>
  </div>
  <div class="search-bar">
    <input class="search-input" placeholder="搜索策略名称或类名..." oninput="filterList(this.value)">
  </div>
  <div class="list" id="stratList"></div>
</div>

<!-- ===== DETAIL VIEW ===== -->
<div id="detailView">
  <div class="dh sec-enter">
    <button class="back-btn" onclick="goBack()"><span class="ba">←</span> 返回</button>
    <div class="dh-icon" id="dhIcon">BM</div>
    <div>
      <div class="dh-title" id="dhTitle">btc_multi_factor</div>
      <div class="dh-path" id="dhPath">tino/strategies/btc_multi_factor.py</div>
    </div>
    <div class="dh-actions">
      <span class="badge badge-type" id="dhType">策略</span>
      <button class="btn-g" style="font-size:.68rem;padding:.3rem .65rem">打开文件夹</button>
      <button class="btn-g" style="font-size:.68rem;padding:.3rem .65rem">验证</button>
      <button class="btn-g" style="font-size:.68rem;padding:.3rem .65rem;border-color:var(--dan);color:var(--dan)">删除</button>
    </div>
  </div>
  <div class="sec sec-enter">
    <div class="sl">概览</div>
    <div class="info-grid" id="infoGrid"></div>
  </div>
  <div class="sec sec-enter">
    <div class="sl">参数 <span style="font-weight:400;color:var(--t2);letter-spacing:0" id="paramCnt"></span></div>
    <div class="cd">
      <table class="ptbl"><thead><tr><th>参数名</th><th>类型</th><th class="tr">默认值</th><th class="tr">优化范围</th></tr></thead><tbody id="paramBody"></tbody></table>
    </div>
  </div>
  <div class="sec sec-enter">
    <div class="sl">版本历史</div>
    <div class="vtl" id="versionTl"></div>
  </div>
</div>

</div>

<script>
const STRATS=[
  {id:'bmf',name:'btc_multi_factor',cls:'BTCMultiFactorMHFV3',type:'策略',ver:'v3',path:'tino/strategies/btc_multi_factor.py',
   info:{策略名称:'btc_multi_factor',策略类:'BTCMultiFactorMHFV3',类型:'策略',版本:'v3',框架:'NautilusTrader',交易所:'Binance Futures'},
   params:[
    {name:'max_leverage',type:'float',val:'10.0',min:'1.0',max:'20.0'},
    {name:'use_kelly',type:'bool',val:'True',min:'',max:''},
    {name:'disable_risk_gates',type:'bool',val:'False',min:'',max:''},
    {name:'fractional_kelly',type:'float',val:'0.28',min:'0.1',max:'0.5'},
    {name:'kelly_cap',type:'float',val:'0.09',min:'0.01',max:'0.2'},
    {name:'risk_cap_per_trade',type:'float',val:'0.006',min:'0.001',max:'0.02'},
    {name:'entry_edge_min',type:'float',val:'1.08',min:'0.5',max:'2.0'},
    {name:'exit_edge_threshold',type:'float',val:'0.3',min:'0.1',max:'1.0'},
    {name:'atr_period',type:'int',val:'14',min:'5',max:'50'},
    {name:'momentum_window',type:'int',val:'24',min:'6',max:'72'},
    {name:'vol_lookback',type:'int',val:'120',min:'20',max:'500'},
    {name:'signal_decay',type:'float',val:'0.95',min:'0.8',max:'0.99'},
   ],
   versions:[
    {ver:'v3',date:'2026-03-28',msg:'多因子融合重构，加入 signed flow + volatility regime',tag:'latest',tagColor:'suc'},
    {ver:'v3.2',date:'2026-03-15',msg:'Kelly 仓位管理优化，加入 fractional kelly cap'},
    {ver:'v3.1',date:'2026-02-20',msg:'修复 entry edge 计算 bug，调整 momentum window'},
    {ver:'v3-beta',date:'2026-02-01',msg:'v3 架构初版，从 v2 迁移到 NautilusTrader'},
   ]},
  {id:'bmf31',name:'btc_multi_factor_v31',cls:'BTCMultiFactorV31',type:'策略',ver:'v31',path:'tino/strategies/btc_multi_factor_v31.py',
   info:{策略名称:'btc_multi_factor_v31',策略类:'BTCMultiFactorV31',类型:'策略',版本:'v31',框架:'NautilusTrader',交易所:'Binance Futures'},
   params:[
    {name:'max_leverage',type:'float',val:'10.0',min:'',max:''},
    {name:'fractional_kelly',type:'float',val:'0.25',min:'',max:''},
    {name:'entry_edge_min',type:'float',val:'1.05',min:'',max:''},
    {name:'atr_period',type:'int',val:'14',min:'',max:''},
   ],versions:[{ver:'v31',date:'2026-02-20',msg:'Entry edge 修复版'}]},
  {id:'bmf32',name:'btc_multi_factor_v32',cls:'BTCMultiFactorV32',type:'策略',ver:'v32',path:'tino/strategies/btc_multi_factor_v32.py',
   info:{策略名称:'btc_multi_factor_v32',策略类:'BTCMultiFactorV32',类型:'策略',版本:'v32',框架:'NautilusTrader',交易所:'Binance Futures'},
   params:[
    {name:'max_leverage',type:'float',val:'10.0',min:'',max:''},
    {name:'fractional_kelly',type:'float',val:'0.28',min:'',max:''},
    {name:'kelly_cap',type:'float',val:'0.09',min:'',max:''},
    {name:'momentum_window',type:'int',val:'24',min:'',max:''},
   ],versions:[{ver:'v32',date:'2026-03-15',msg:'Kelly cap 优化版'}]},
  {id:'bmf33',name:'btc_multi_factor_v33',cls:'BTCMultiFactorV33',type:'策略',ver:'v33',path:'tino/strategies/btc_multi_factor_v33.py',
   info:{策略名称:'btc_multi_factor_v33',策略类:'BTCMultiFactorV33',类型:'策略',版本:'v33',框架:'NautilusTrader',交易所:'Binance Futures'},
   params:[
    {name:'max_leverage',type:'float',val:'8.0',min:'',max:''},
    {name:'signal_decay',type:'float',val:'0.92',min:'',max:''},
    {name:'vol_lookback',type:'int',val:'100',min:'',max:''},
   ],versions:[{ver:'v33',date:'2026-03-25',msg:'降低杠杆 + 调整波动率窗口'}]},
  {id:'sfpt',name:'signed_flow_persistence_test',cls:'SignedFlowPersistenceTest',type:'策略',ver:'v0.1',path:'tino/strategies/signed_flow_persistence.py',
   info:{策略名称:'signed_flow_persistence_test',策略类:'SignedFlowPersistenceTest',类型:'策略',版本:'实验性',框架:'NautilusTrader',交易所:'Binance Futures'},
   params:[
    {name:'flow_window',type:'int',val:'60',min:'10',max:'300'},
    {name:'persistence_threshold',type:'float',val:'0.7',min:'0.5',max:'0.95'},
    {name:'min_volume',type:'float',val:'100000',min:'',max:''},
    {name:'position_size',type:'float',val:'0.1',min:'0.01',max:'0.5'},
   ],versions:[{ver:'v0.1',date:'2026-03-30',msg:'Signed flow 持续性因子实验',tag:'experimental',tagColor:'warn'}]},
];

/* === LIST === */
function renderList(filter=''){
  const list=document.getElementById('stratList');list.innerHTML='';
  const f=filter.toLowerCase();
  const filtered=STRATS.filter(s=>!f||s.name.includes(f)||s.cls.toLowerCase().includes(f));
  document.getElementById('stratCount').textContent='· '+filtered.length+' 个策略';
  filtered.forEach(s=>{
    list.innerHTML+=`<div class="row" onclick="goDetail('${s.id}')">
      <div class="row-acc" style="background:var(--acc)"></div>
      <div class="row-info">
        <div class="row-name">${s.name} <span class="badge badge-type">${s.type}</span></div>
        <div class="row-meta">${s.cls} · ${s.path}</div>
      </div>
      <div class="row-col dim">${s.ver}</div>
      <div class="row-col dim">${s.params.length} 参数</div>
      <div class="row-arrow">→</div>
    </div>`;
  });
}

function filterList(v){renderList(v)}

/* === TRANSITIONS === */
function goDetail(id){
  const s=STRATS.find(x=>x.id===id);if(!s)return;
  document.getElementById('listView').classList.add('hide');
  setTimeout(()=>{
    document.getElementById('listView').style.display='none';
    const dv=document.getElementById('detailView');dv.classList.add('show');dv.style.display='block';
    renderDetail(s);
    setTimeout(()=>dv.querySelectorAll('.sec-enter').forEach(el=>el.classList.add('v')),50);
  },350);
  window.scrollTo({top:0,behavior:'smooth'});
}
function goBack(){
  const dv=document.getElementById('detailView');dv.classList.remove('show');dv.style.display='none';
  dv.querySelectorAll('.sec-enter').forEach(el=>el.classList.remove('v'));
  const lv=document.getElementById('listView');lv.style.display='';lv.classList.remove('hide');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* === DETAIL === */
function renderDetail(s){
  document.getElementById('dhIcon').textContent=s.name.substring(0,2).toUpperCase();
  document.getElementById('dhTitle').textContent=s.name;
  document.getElementById('dhPath').textContent=s.path;
  document.getElementById('dhType').textContent=s.type;

  const ig=document.getElementById('infoGrid');ig.innerHTML='';
  Object.entries(s.info).forEach(([k,v])=>{ig.innerHTML+=`<div class="info-item"><div class="info-label">${k}</div><div class="info-val">${v}</div></div>`});

  document.getElementById('paramCnt').textContent=s.params.length+' 个';
  const pb=document.getElementById('paramBody');pb.innerHTML='';
  s.params.forEach(p=>{
    const tc={float:{bg:'var(--info-d)',c:'var(--info)'},int:{bg:'var(--suc-d)',c:'var(--suc)'},bool:{bg:'var(--warn-d)',c:'var(--warn)'}};
    const t=tc[p.type]||tc.float;const hasRange=p.min||p.max;
    pb.innerHTML+=`<tr><td><span class="pname">${p.name}</span></td><td><span class="ptype" style="background:${t.bg};color:${t.c}">${p.type}</span></td><td class="tr"><span class="pval">${p.val}</span></td><td class="tr">${hasRange?`<div class="prange"><input class="prange-input" value="${p.min}"><span style="color:var(--t3);font-size:.65rem">→</span><input class="prange-input" value="${p.max}"></div>`:'<span style="color:var(--t3)">—</span>'}</td></tr>`;
  });

  const vt=document.getElementById('versionTl');vt.innerHTML='';
  s.versions.forEach(v=>{
    const tag=v.tag?`<span class="vtl-tag" style="background:var(--${v.tagColor}-d);color:var(--${v.tagColor})">${v.tag}</span>`:'';
    vt.innerHTML+=`<div class="vtl-item"><div class="vtl-dot"></div><div class="vtl-head"><span class="vtl-ver">${v.ver}</span>${tag}<span class="vtl-date">${v.date}</span></div><div class="vtl-msg">${v.msg}</div></div>`;
  });
}

renderList();
</script>
</body>
</html>
