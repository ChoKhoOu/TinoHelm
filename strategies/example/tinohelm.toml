# Example strategy config.
# Copy this file to {your-name}.toml and adjust to your venue.
#
# `mode` is overridden by the env var TINO_MODE if set (so `make sandbox`
# flips a live config to sandbox without editing TOML).

[strategy]
id = "EXAMPLE-001"
trader_id = "TINO-001"
mode = "sandbox"  # "live" or "sandbox"
class = "strategies.example.strategy:ExampleStrategy"
config_class = "strategies.example.strategy:ExampleStrategyConfig"

[strategy.params]
instrument_id = "BTCUSDT-PERP.BYBIT"
spread_threshold_bps = 5.0
log_every_n = 100

[message_bus]
# REDIS_URL env var overrides this.
redis_url = "redis://redis:6379/0"
encoding = "msgpack"
streams_prefix = "stream"
# false → events funnel into one aggregate stream (trader-<id>:stream) the
# notifier can subscribe to with a single literal key (NT external_streams does
# no globbing). See the notifier runner's build_external_streams / the
# oi_momentum_lowvol toml for the full rationale.
stream_per_topic = false
autotrim_mins = 60
external_streams = []  # tinohelm:control:EXAMPLE-001 added automatically

[cache]
# Optional. If absent, NT runs in pure in-memory mode.
redis_url = "redis://redis:6379/0"
encoding = "msgpack"

[exec]
# Passes straight through to NT's LiveExecEngineConfig. All optional — omit
# the whole section to keep TinoHelm's defaults shown below.
#
# Continuous reconciliation: poll the venue after startup to catch orders/fills
# that drifted while the pod was down. NT defaults these to None (startup-only);
# TinoHelm defaults them on. Mind your venue's API rate limits. Set to "none"
# to fall back to NT's startup-only mode (TOML has no null literal).
open_check_interval_secs = 10.0       # NT recommends 5-10s; "none" disables
position_check_interval_secs = 60.0   # NT recommends 30-60s; "none" disables
# Snapshots: append-only audit trail of every order/position state change,
# written to the snapshots:orders / snapshots:positions Redis lists. NOT used
# for restart recovery (that's [cache] + reconciliation) — purely for
# analysis/PnL replay. NT does not auto-trim these lists (unbounded growth), so
# they default OFF; opt in below only if you want the full history.
snapshot_orders = false
snapshot_positions = false

[logging]
log_level = "INFO"

# ─── Venue / exec wiring ─────────────────────────────────────────────────────
[factories.data]
BYBIT = "nautilus_trader.adapters.bybit.factories:BybitLiveDataClientFactory"

[factories.exec]
# In sandbox mode the runner overrides this with NT's SandboxLiveExecClientFactory.
BYBIT = "nautilus_trader.adapters.bybit.factories:BybitLiveExecClientFactory"

[data_clients.BYBIT]
api_key = "$ENV:BYBIT_API_KEY"
api_secret = "$ENV:BYBIT_API_SECRET"
environment = "MAINNET"
product_types = ["LINEAR"]

[exec_clients.BYBIT]
api_key = "$ENV:BYBIT_API_KEY"
api_secret = "$ENV:BYBIT_API_SECRET"
environment = "MAINNET"
product_types = ["LINEAR"]

# ─── Sandbox overrides ───────────────────────────────────────────────────────
[sandbox]
starting_balances = ["100_000 USDT"]
oms_type = "NETTING"
account_type = "MARGIN"
book_type = "L1_MBP"
default_leverage = 10
