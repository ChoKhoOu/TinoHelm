services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinohelm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinohelm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tinohelm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ~/.tino/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tinohelm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ~/.tino/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tinohelm-api:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ~/.tino/strategies:/app/tino/strategies
      - ~/.tino/actors:/app/tino/actors
      - ~/.tino/data/catalog:/app/tino/data/catalog
      - ~/.tino/data/artifacts:/app/tino/data/artifacts
      - ~/.tino/logs:/app/tino/logs
      - ~/.tino/research:/app/tino/research
      - ~/.tino/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TINO_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-tinohelm}:${POSTGRES_PASSWORD:-tinohelm_secret}@postgres:5432/${POSTGRES_DB:-tinohelm}"
      TINO_REDIS__URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379"
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"
      HOST_HOME: "${HOME}"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  node-sandbox:
    image: tinohelm-api:latest
    restart: on-failure
    command: ["python", "-m", "tinohelm.node.sandbox_main"]
    profiles: ["sandbox"]
    volumes:
      - ~/.tino/strategies:/app/tino/strategies
      - ~/.tino/actors:/app/tino/actors
      - ~/.tino/data/catalog:/app/tino/data/catalog
      - ~/.tino/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TINO_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-tinohelm}:${POSTGRES_PASSWORD:-tinohelm_secret}@postgres:5432/${POSTGRES_DB:-tinohelm}"
      TINO_REDIS__URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379"
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"
      SSL_CERT_FILE: "/usr/lib/ssl/cert.pem"
      TINO_STRATEGIES_DIR: "/app/tino/strategies"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import redis; r=redis.Redis.from_url('redis://:${REDIS_PASSWORD:-changeme}@redis:6379'); assert r.exists('tino:heartbeat:sandbox')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  node-live:
    image: tinohelm-api:latest
    restart: on-failure
    command: ["python", "-m", "tinohelm.node.live_main"]
    profiles: ["live"]
    volumes:
      - ~/.tino/strategies:/app/tino/strategies
      - ~/.tino/actors:/app/tino/actors
      - ~/.tino/data/catalog:/app/tino/data/catalog
      - ~/.tino/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TINO_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-tinohelm}:${POSTGRES_PASSWORD:-tinohelm_secret}@postgres:5432/${POSTGRES_DB:-tinohelm}"
      TINO_REDIS__URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379"
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"
      SSL_CERT_FILE: "/usr/lib/ssl/cert.pem"
      TINO_STRATEGIES_DIR: "/app/tino/strategies"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import redis; r=redis.Redis.from_url('redis://:${REDIS_PASSWORD:-changeme}@redis:6379'); assert r.exists('tino:heartbeat:live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
