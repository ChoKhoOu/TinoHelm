services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinohelm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinohelm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tinohelm}
    ports:
      - "5432:5432"
    volumes:
      - ~/.tino/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tinohelm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - ~/.tino/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ~/.tino/strategies:/app/tino/strategies
      - ~/.tino/data/catalog:/app/tino/data/catalog
      - ~/.tino/data/artifacts:/app/tino/data/artifacts
      - ~/.tino/logs:/app/tino/logs
      - ~/.tino/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TINO_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-tinohelm}:${POSTGRES_PASSWORD:-tinohelm_secret}@postgres:5432/${POSTGRES_DB:-tinohelm}"
      TINO_REDIS__URL: "redis://redis:6379"
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
