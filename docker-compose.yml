services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinohelm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tinohelm_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tinohelm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ~/.tino/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tinohelm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ~/.tino/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${TINO_API_IMAGE:-ghcr.io/chokhoou/tinohelm-api:latest}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ~/.tino/strategies:/app/tino/strategies
      - ~/.tino/actors:/app/tino/actors
      # Mount the entire ``~/.tino/data`` tree so that the child folders
      # (``catalog/``, ``artifacts/``, ``funding_rates/``) AND the
      # top-level cache files (``instruments_cache.json`` /
      # ``funding_info_cache.json``) are all visible via a single bind
      # mount.  Child-level mounts would hide sibling files because
      # Docker overlays each child as its own mount point — the root
      # ``data/`` directory would then only expose the listed mounts.
      - ~/.tino/data:/app/tino/data
      - ~/.tino/factor_cache:/app/tino/factor_cache
      - ~/.tino/logs:/app/tino/logs
      - ~/.tino/research:/app/tino/research
      - ~/.tino/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TINO_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-tinohelm}:${POSTGRES_PASSWORD:-tinohelm_secret}@postgres:5432/${POSTGRES_DB:-tinohelm}"
      TINO_REDIS__URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379"
      # Pin every PathSettings field to its absolute container mount so
      # helpers never fall back to ``/app/.tino/*`` (HOME=/app has no
      # leading-dot dir) and ``Path.home()`` can no longer produce the
      # wrong root inside the container.
      TINO_PATHS__STRATEGIES: "/app/tino/strategies"
      TINO_PATHS__ACTORS: "/app/tino/actors"
      TINO_PATHS__CATALOG: "/app/tino/data/catalog"
      TINO_PATHS__ARTIFACTS: "/app/tino/data/artifacts"
      TINO_PATHS__FUNDING_RATES: "/app/tino/data/funding_rates"
      TINO_PATHS__DATA_CACHE: "/app/tino/data"
      TINO_STORAGE__PROVIDER: "${TINO_STORAGE__PROVIDER:-tos}"
      TINO_STORAGE__TOS__REGION: "${TINO_STORAGE__TOS__REGION:-ap-southeast-3}"
      TINO_STORAGE__TOS__BUCKET: "${TINO_STORAGE__TOS__BUCKET:-trade-data}"
      TINO_STORAGE__TOS__PREFIX: "${TINO_STORAGE__TOS__PREFIX:-}"
      TINO_STORAGE__TOS__ENDPOINT: "${TINO_STORAGE__TOS__ENDPOINT:-https://tos-s3-ap-southeast-3.volces.com}"
      TINO_STORAGE__TOS__ACCESS_KEY: "${TINO_STORAGE__TOS__ACCESS_KEY:-}"
      TINO_STORAGE__TOS__SECRET_KEY: "${TINO_STORAGE__TOS__SECRET_KEY:-}"
      TINO_STORAGE__TOS__SECURITY_TOKEN: "${TINO_STORAGE__TOS__SECURITY_TOKEN:-}"
      TINO_STORAGE__TOS__STAGING_DIR: "/app/tino/data/tos_staging"
      TINO_PATHS__FACTOR_CACHE: "/app/tino/factor_cache"
      TINO_PATHS__LOGS: "/app/tino/logs"
      TINO_PATHS__RESEARCH: "/app/tino/research"
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"
      HOST_HOME: "${HOME}"
      TINO_BACKTEST__MAX_CONCURRENT: "${TINO_BACKTEST__MAX_CONCURRENT:-4}"

  web:
    image: ${TINO_WEB_IMAGE:-ghcr.io/chokhoou/tinohelm-web:latest}
    pull_policy: missing
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

  node-sandbox:
    image: ${TINO_API_IMAGE:-ghcr.io/chokhoou/tinohelm-api:latest}
    pull_policy: missing
    restart: on-failure
    command: ["python", "-m", "tinohelm.node.sandbox_main"]
    profiles: ["sandbox"]
    volumes:
      - ~/.tino/strategies:/app/tino/strategies
      - ~/.tino/actors:/app/tino/actors
      - ~/.tino/data:/app/tino/data
      - ~/.tino/factor_cache:/app/tino/factor_cache
      - ~/.tino/logs:/app/tino/logs
      - ~/.tino/research:/app/tino/research
      - ~/.tino/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TINO_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-tinohelm}:${POSTGRES_PASSWORD:-tinohelm_secret}@postgres:5432/${POSTGRES_DB:-tinohelm}"
      TINO_REDIS__URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379"
      # Pin every PathSettings field — the node workers will eventually
      # need factor/funding/artifact access for cross-process features, so
      # we keep the surface identical to the api service.
      TINO_PATHS__STRATEGIES: "/app/tino/strategies"
      TINO_PATHS__ACTORS: "/app/tino/actors"
      TINO_PATHS__CATALOG: "/app/tino/data/catalog"
      TINO_PATHS__ARTIFACTS: "/app/tino/data/artifacts"
      TINO_PATHS__FUNDING_RATES: "/app/tino/data/funding_rates"
      TINO_PATHS__DATA_CACHE: "/app/tino/data"
      TINO_STORAGE__PROVIDER: "${TINO_STORAGE__PROVIDER:-tos}"
      TINO_STORAGE__TOS__REGION: "${TINO_STORAGE__TOS__REGION:-ap-southeast-3}"
      TINO_STORAGE__TOS__BUCKET: "${TINO_STORAGE__TOS__BUCKET:-trade-data}"
      TINO_STORAGE__TOS__PREFIX: "${TINO_STORAGE__TOS__PREFIX:-}"
      TINO_STORAGE__TOS__ENDPOINT: "${TINO_STORAGE__TOS__ENDPOINT:-https://tos-s3-ap-southeast-3.volces.com}"
      TINO_STORAGE__TOS__ACCESS_KEY: "${TINO_STORAGE__TOS__ACCESS_KEY:-}"
      TINO_STORAGE__TOS__SECRET_KEY: "${TINO_STORAGE__TOS__SECRET_KEY:-}"
      TINO_STORAGE__TOS__SECURITY_TOKEN: "${TINO_STORAGE__TOS__SECURITY_TOKEN:-}"
      TINO_STORAGE__TOS__STAGING_DIR: "/app/tino/data/tos_staging"
      TINO_PATHS__FACTOR_CACHE: "/app/tino/factor_cache"
      TINO_PATHS__LOGS: "/app/tino/logs"
      TINO_PATHS__RESEARCH: "/app/tino/research"
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"
      SSL_CERT_FILE: "/usr/lib/ssl/cert.pem"
      # Legacy env kept for back-compat (``node._common.resolve_strategies_dir``
      # honours it first).  New deployments should prefer
      # ``TINO_PATHS__STRATEGIES`` which feeds the same value into
      # ``PathSettings`` alongside every other root.
      TINO_STRATEGIES_DIR: "/app/tino/strategies"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import redis; r=redis.Redis.from_url('redis://:${REDIS_PASSWORD:-changeme}@redis:6379'); assert r.exists('tino:heartbeat:sandbox')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  node-live:
    image: ${TINO_API_IMAGE:-ghcr.io/chokhoou/tinohelm-api:latest}
    pull_policy: missing
    restart: on-failure
    command: ["python", "-m", "tinohelm.node.live_main"]
    profiles: ["live"]
    volumes:
      - ~/.tino/strategies:/app/tino/strategies
      - ~/.tino/actors:/app/tino/actors
      - ~/.tino/data:/app/tino/data
      - ~/.tino/factor_cache:/app/tino/factor_cache
      - ~/.tino/logs:/app/tino/logs
      - ~/.tino/research:/app/tino/research
      - ~/.tino/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      TINO_DATABASE__URL: "postgresql+asyncpg://${POSTGRES_USER:-tinohelm}:${POSTGRES_PASSWORD:-tinohelm_secret}@postgres:5432/${POSTGRES_DB:-tinohelm}"
      TINO_REDIS__URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379"
      TINO_PATHS__STRATEGIES: "/app/tino/strategies"
      TINO_PATHS__ACTORS: "/app/tino/actors"
      TINO_PATHS__CATALOG: "/app/tino/data/catalog"
      TINO_PATHS__ARTIFACTS: "/app/tino/data/artifacts"
      TINO_PATHS__FUNDING_RATES: "/app/tino/data/funding_rates"
      TINO_PATHS__DATA_CACHE: "/app/tino/data"
      TINO_STORAGE__PROVIDER: "${TINO_STORAGE__PROVIDER:-tos}"
      TINO_STORAGE__TOS__REGION: "${TINO_STORAGE__TOS__REGION:-ap-southeast-3}"
      TINO_STORAGE__TOS__BUCKET: "${TINO_STORAGE__TOS__BUCKET:-trade-data}"
      TINO_STORAGE__TOS__PREFIX: "${TINO_STORAGE__TOS__PREFIX:-}"
      TINO_STORAGE__TOS__ENDPOINT: "${TINO_STORAGE__TOS__ENDPOINT:-https://tos-s3-ap-southeast-3.volces.com}"
      TINO_STORAGE__TOS__ACCESS_KEY: "${TINO_STORAGE__TOS__ACCESS_KEY:-}"
      TINO_STORAGE__TOS__SECRET_KEY: "${TINO_STORAGE__TOS__SECRET_KEY:-}"
      TINO_STORAGE__TOS__SECURITY_TOKEN: "${TINO_STORAGE__TOS__SECURITY_TOKEN:-}"
      TINO_STORAGE__TOS__STAGING_DIR: "/app/tino/data/tos_staging"
      TINO_PATHS__FACTOR_CACHE: "/app/tino/factor_cache"
      TINO_PATHS__LOGS: "/app/tino/logs"
      TINO_PATHS__RESEARCH: "/app/tino/research"
      BINANCE_API_KEY: "${BINANCE_API_KEY:-}"
      BINANCE_API_SECRET: "${BINANCE_API_SECRET:-}"
      SSL_CERT_FILE: "/usr/lib/ssl/cert.pem"
      # Legacy env kept for back-compat; see node-sandbox for rationale.
      TINO_STRATEGIES_DIR: "/app/tino/strategies"
    healthcheck:
      test: ["CMD", "python", "-c",
        "import redis; r=redis.Redis.from_url('redis://:${REDIS_PASSWORD:-changeme}@redis:6379'); assert r.exists('tino:heartbeat:live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
