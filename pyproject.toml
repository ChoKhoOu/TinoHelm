[project]
name = "tinohelm"
version = "0.1.0"
description = "Thin orchestrator around NautilusTrader: per-strategy pods, Redis msgbus, Discord notifier."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "ChoKhoOu" }]

dependencies = [
  "nautilus_trader==1.227.0",
  "discord.py>=2.4,<3",
  "redis>=5.0,<6",
  "typer>=0.12,<1",
  "uvloop>=0.19; sys_platform != 'win32'",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "fakeredis>=2.23",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
tinohelm = "tinohelm.cli:app"
tinohelm-strategy = "tinohelm.strategy_runner:main"
tinohelm-notifier = "tinohelm.notifier.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tinohelm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# RUF001/002/003: 中文 Discord 文案使用全角标点（，（）等）是正确写法
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
