[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinohelm"
version = "0.1.0"
description = "Single-instance quantitative trading platform powered by NautilusTrader"
requires-python = ">=3.12"
dependencies = [
    "nautilus_trader==1.225.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis>=5.0.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "plotly>=6.3.1",
    "scipy>=1.14.0",
    "polars>=1.20.0",
    "joblib>=1.4.0",
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
optimize = ["optuna>=3.0.0", "cmaes>=0.10.0"]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "freezegun>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x -q --tb=short"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:nautilus_trader.*",
]
markers = [
    "integration: marks tests that require real infrastructure (DB, Redis, subprocess)",
]

[tool.setuptools.packages.find]
where = ["src"]
