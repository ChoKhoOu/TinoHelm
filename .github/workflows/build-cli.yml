name: Build CLI

on:
  push:
    paths:
      - 'cli/**'
      - 'Makefile'
      - '.github/workflows/build-cli.yml'
  pull_request:
    paths:
      - 'cli/**'
      - 'Makefile'

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check CLI contract

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust CLI
        working-directory: cli
        run: |
          cargo fmt --check
          cargo check --locked
          cargo test --locked
          cargo build --locked
          ./target/debug/tino --help >/tmp/tino-help.txt
          ./target/debug/tino version -f json | python3 -m json.tool >/tmp/tino-version.json

          set +e
          ./target/debug/tino -f json node lifecycle flatten --mode sandbox >/tmp/tino-confirmation-json.out 2>/tmp/tino-confirmation-json.err
          confirmation_json_status=$?
          ./target/debug/tino -f llm node lifecycle halt --mode sandbox >/tmp/tino-confirmation-llm.out 2>/tmp/tino-confirmation-llm.err
          confirmation_llm_status=$?
          set -e
          test "$confirmation_json_status" -ne 0
          test "$confirmation_llm_status" -ne 0
          test ! -s /tmp/tino-confirmation-json.err
          test ! -s /tmp/tino-confirmation-llm.err
          python3 - <<'PY'
          import json
          for path, command in [
              ("/tmp/tino-confirmation-json.out", "node.lifecycle.flatten"),
              ("/tmp/tino-confirmation-llm.out", "node.lifecycle.halt"),
          ]:
              with open(path) as f:
                  payload = json.load(f)
              assert payload["ok"] is False
              assert payload["error"]["kind"] == "confirmation_required"
              assert payload["error"]["body"]["required_flag"] == "--yes"
              assert payload["meta"]["command"] == command
          PY

      - name: Verify Makefile install
        run: |
          make install BINDIR=/tmp/tino-bin
          PATH="/tmp/tino-bin:$PATH" sh -c 'cd /tmp && tino --help >/tmp/tino-make-help.txt'
          PATH="/tmp/tino-bin:$PATH" sh -c 'cd /tmp && tino version -f json | python3 -m json.tool >/tmp/tino-make-version.json'

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tino-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: tino-darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: tino-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: tino-linux-arm64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p cli/.cargo
          cat > cli/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        working-directory: cli
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp cli/target/${{ matrix.target }}/release/tino tino
          chmod +x tino
          tar czf ${{ matrix.artifact }}.tar.gz tino

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
