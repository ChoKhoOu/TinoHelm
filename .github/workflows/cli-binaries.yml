name: CLI Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'CONTEXT.md'
      - 'LICENSE*'
      - '.gitignore'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runs-on: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - runs-on: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p "$HOME/.cargo"
          cat > "$HOME/.cargo/config.toml" <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build release binary
        run: cargo build --manifest-path cli/Cargo.toml --locked --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          tmpdir="$(mktemp -d)"
          install -m 0755 "cli/target/${{ matrix.target }}/release/tino" "$tmpdir/tino"
          tar -C "$tmpdir" -czf "tino-${{ matrix.target }}.tar.gz" tino
          rm -rf "$tmpdir"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tino-${{ matrix.target }}
          path: tino-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find dist -type f -name 'tino-*.tar.gz' -exec cp {} release-assets/ \;
          ls -1 release-assets

      - name: Publish nightly prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for asset_path in release-assets/*.tar.gz; do
              gh release delete-asset nightly "$(basename "$asset_path")" --repo "$GITHUB_REPOSITORY" --yes || true
            done
            gh release upload nightly release-assets/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --prerelease --title "nightly" --notes "Latest CLI build from main."
          else
            gh release create nightly release-assets/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "nightly" \
              --notes "Latest CLI build from main."
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release-assets/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --notes "CLI binaries for $tag."
          fi
