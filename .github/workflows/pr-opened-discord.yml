name: Notify Discord on PR Opened

on:
  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          REPO: ${{ github.repository }}
          REPO_URL: ${{ github.event.repository.html_url }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set — skipping Discord notification."
            exit 0
          fi

          payload=$(jq -n \
            --arg title "#${PR_NUMBER} ${PR_TITLE}" \
            --arg url "$PR_URL" \
            --arg body "${PR_BODY:-}" \
            --arg repo "$REPO" \
            --arg repo_url "$REPO_URL" \
            --arg branch "\`${HEAD_REF}\` → \`${BASE_REF}\`" \
            --arg author "$PR_AUTHOR" \
            --arg author_url "https://github.com/${PR_AUTHOR}" \
            --arg author_icon "https://github.com/${PR_AUTHOR}.png?size=64" \
            --arg ts "$PR_CREATED_AT" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: ($body | .[0:400]),
                color: 3055683,
                author: {
                  name: $author,
                  url: $author_url,
                  icon_url: $author_icon
                },
                fields: [
                  {name: "Repository", value: ("[" + $repo + "](" + $repo_url + ")"), inline: true},
                  {name: "Branch", value: $branch, inline: true}
                ],
                footer: {text: "GitHub · Pull Request opened"},
                timestamp: $ts
              }]
            }')

          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
