x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  TINO_TRADER_ID: ${TINO_TRADER_ID:-TINO-001}
  TINO_LOG_LEVEL: ${TINO_LOG_LEVEL:-INFO}
  TINO_MODE: ${TINO_MODE:-live}

services:
  redis:
    image: redis:7-alpine
    container_name: tinohelm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  notifier:
    image: ${TINO_NOTIFIER_IMAGE:-ghcr.io/chokhoou/tinohelm-notifier:latest}
    build:
      context: .
      dockerfile: docker/notifier.Dockerfile
    container_name: tinohelm-notifier
    pull_policy: always
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *common-env
      TINO_NOTIFIER_CONFIG: /app/configs/notifier.toml
    volumes:
      - ./configs:/app/configs:ro
      - ./strategies:/app/strategies:ro

  # ─── strategy template ────────────────────────────────────────────────
  # 通用策略 service。``make deploy STRATEGY=foo`` 会用 ``docker compose run``
  # 实例化它（指定 --name tinohelm-strategy-foo 和 TINO_STRATEGY_ID=foo）。
  # 不需要为每个策略复制一份 service 配置；用户只往 strategies/foo/ 丢代码即可。
  # ``profiles: ["never"]`` 防止 ``docker compose up`` 自动唤醒它。
  strategy:
    image: ${TINO_STRATEGY_IMAGE:-ghcr.io/chokhoou/tinohelm-strategy:latest}
    build:
      context: .
      dockerfile: docker/strategy.Dockerfile
    profiles: ["never"]
    pull_policy: always
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      <<: *common-env
      TINO_STRATEGY_ID: ""  # set by ``docker compose run -e TINO_STRATEGY_ID=foo``
    volumes:
      - ./strategies:/app/strategies:ro
      - ./logs:/app/logs

volumes:
  redis-data:
