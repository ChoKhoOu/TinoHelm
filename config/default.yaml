server:
  host: "0.0.0.0"
  port: 8000

database:
  url: "postgresql+asyncpg://tinohelm:tinohelm@localhost:5432/tinohelm"

redis:
  url: "redis://localhost:6379"

binance:
  account_type: "USDT_FUTURES"
  testnet: true

paths:
  strategies: "tino/strategies"
  actors: "tino/actors"
  catalog: "tino/data/catalog"
  artifacts: "tino/data/artifacts"
  research: "tino/research"
  logs: "tino/logs"
  funding_rates: "tino/data/funding_rates"
  data_cache: "tino/data"
  factor_cache: "tino/factor_cache"

data:
  download_concurrency: 4
  job_concurrency: 4
  convert_workers: 1
  chunk_rows: 1000000
  tick_chunk_rows: 500000
  csv_queue_maxsize: 1
  tick_max_days_per_job: 1

backtest:
  max_concurrent: 4
  # DEPRECATED — retained for back-compat; not consumed.
  max_workers: 2
  streaming_enabled: true
  stream_batch_size: 100000

storage:
  # local = existing filesystem catalog; tos/s3 = S3-compatible NT catalog URI.
  provider: "local"
  tos:
    region: "cn-beijing"
    bucket: ""
    prefix: ""
    # Empty endpoint derives the public TOS S3 endpoint:
    # https://tos-s3-{region}.volces.com
    endpoint: ""
    max_keys: 1000
