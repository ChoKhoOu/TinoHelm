<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.r{display:flex;align-items:center;gap:12px;padding:7px 10px;background:var(--bg-p);border:1px solid var(--bd);border-radius:var(--rs)}
.sw{width:24px;height:24px;border-radius:5px;border:1px solid var(--bd)}
.nm{font-family:var(--font-d);font-size:.68rem;min-width:120px}
.hx{font-family:var(--font-d);font-size:.58rem;color:var(--t3)}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner" style="gap:8px">
    <div class="r"><div class="sw" style="background:#2C2C2A"></div><span class="nm" style="color:#2C2C2A">--t0 primary</span><span class="hx">#2C2C2A</span></div>
    <div class="r"><div class="sw" style="background:#73726C"></div><span class="nm" style="color:#73726C">--t1 secondary</span><span class="hx">#73726C</span></div>
    <div class="r"><div class="sw" style="background:#9C9A92"></div><span class="nm" style="color:#9C9A92">--t2 tertiary</span><span class="hx">#9C9A92</span></div>
    <div class="r"><div class="sw" style="background:#B0ADA5"></div><span class="nm" style="color:#B0ADA5">--t3 quaternary</span><span class="hx">#B0ADA5</span></div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner" style="gap:8px">
    <div class="r"><div class="sw" style="background:#E8E6E0"></div><span class="nm" style="color:#E8E6E0">--t0 primary</span><span class="hx">#E8E6E0</span></div>
    <div class="r"><div class="sw" style="background:#9C9A92"></div><span class="nm" style="color:#9C9A92">--t1 secondary</span><span class="hx">#9C9A92</span></div>
    <div class="r"><div class="sw" style="background:#73726C"></div><span class="nm" style="color:#73726C">--t2 tertiary</span><span class="hx">#73726C</span></div>
    <div class="r"><div class="sw" style="background:#5F5E5A"></div><span class="nm" style="color:#5F5E5A">--t3 quaternary</span><span class="hx">#5F5E5A</span></div>
  </div></div>
</div>
</body></html>
