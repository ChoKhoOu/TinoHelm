<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.stack{display:flex;gap:14px;align-items:center}
.main{flex:1;background:var(--acc);border-radius:var(--r);height:110px;display:flex;align-items:flex-end;padding:12px;font-family:var(--font-d);font-size:.68rem;color:#fff}
.chips{display:flex;flex-direction:column;gap:6px;min-width:120px}
.chip{border-radius:var(--rs);padding:6px 10px;font-family:var(--font-d);font-size:.6rem;display:flex;justify-content:space-between;gap:12px}
.sub{font-size:.52rem;letter-spacing:.15em;text-transform:uppercase;opacity:.8}
.val{font-family:var(--font-d);font-size:.82rem;margin-top:3px}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="stack">
      <div class="main"><div><div class="sub">BURNT ORANGE · PRIMARY</div><div class="val">--acc · #D97857</div></div></div>
      <div class="chips">
        <div class="chip" style="background:var(--acc-d);color:var(--acc);border:1px solid var(--acc)"><span>--acc-d</span><span>.08α</span></div>
        <div class="chip" style="background:var(--acc-s);color:var(--acc)"><span>--acc-s</span><span>#FAF0E8</span></div>
        <div class="chip" style="background:var(--bg-p);color:var(--acc);border:1px solid var(--bd)"><span>on card</span><span>text</span></div>
      </div>
    </div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="stack">
      <div class="main"><div><div class="sub">BURNT ORANGE · PRIMARY</div><div class="val">--acc · #D97857</div></div></div>
      <div class="chips">
        <div class="chip" style="background:var(--acc-d);color:var(--acc);border:1px solid var(--acc)"><span>--acc-d</span><span>.12α</span></div>
        <div class="chip" style="background:var(--acc-s);color:var(--acc)"><span>--acc-s</span><span>#3A2520</span></div>
        <div class="chip" style="background:var(--bg-p);color:var(--acc);border:1px solid var(--bd)"><span>on card</span><span>text</span></div>
      </div>
    </div>
  </div></div>
</div>
</body></html>
