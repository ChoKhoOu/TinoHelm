<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>.wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="wrap">
      <span class="badge badge-pos">✓ Done</span>
      <span class="badge badge-neg">✕ Failed</span>
      <span class="badge badge-info">◉ Running</span>
      <span class="badge badge-warn">排队中</span>
      <span class="badge badge-neutral">◦ Queued</span>
      <span class="badge badge-acc">latest</span>
    </div>
    <div class="wrap">
      <span class="badge badge-neutral" style="letter-spacing:.1em;text-transform:uppercase">SANDBOX</span>
      <span class="badge" style="background:var(--dan-d);color:var(--dan);letter-spacing:.1em;text-transform:uppercase">LIVE</span>
    </div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="wrap">
      <span class="badge badge-pos">✓ Done</span>
      <span class="badge badge-neg">✕ Failed</span>
      <span class="badge badge-info">◉ Running</span>
      <span class="badge badge-warn">排队中</span>
      <span class="badge badge-neutral">◦ Queued</span>
      <span class="badge badge-acc">latest</span>
    </div>
    <div class="wrap">
      <span class="badge badge-neutral" style="letter-spacing:.1em;text-transform:uppercase">SANDBOX</span>
      <span class="badge" style="background:var(--dan-d);color:var(--dan);letter-spacing:.1em;text-transform:uppercase">LIVE</span>
    </div>
  </div></div>
</div>
</body></html>
