<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.sw-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sw{border-radius:var(--rs);padding:10px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--bd);background:var(--bg-p)}
.name{font-family:var(--font-d);font-size:.64rem;color:var(--t0);font-weight:600}
.hex{font-family:var(--font-d);font-size:.56rem;color:var(--t2)}
.big{height:44px;border-radius:var(--rs);margin-bottom:3px;border:1px solid var(--bd)}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="sw-grid">
      <div class="sw"><div class="big" style="background:var(--bg-s)"></div><span class="name">--bg-s</span><span class="hex">#faf9f5 body</span></div>
      <div class="sw"><div class="big" style="background:var(--bg-p)"></div><span class="name">--bg-p</span><span class="hex">#f5f4ed card</span></div>
      <div class="sw"><div class="big" style="background:var(--bg-t)"></div><span class="name">--bg-t</span><span class="hex">#eae8e0 hover</span></div>
      <div class="sw"><div class="big" style="background:var(--bg-in)"></div><span class="name">--bg-in</span><span class="hex">#fcfbf8 sunken</span></div>
    </div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="sw-grid">
      <div class="sw"><div class="big" style="background:var(--bg-s)"></div><span class="name">--bg-s</span><span class="hex">#262624 body</span></div>
      <div class="sw"><div class="big" style="background:var(--bg-p)"></div><span class="name">--bg-p</span><span class="hex">#302f2d card</span></div>
      <div class="sw"><div class="big" style="background:var(--bg-t)"></div><span class="name">--bg-t</span><span class="hex">#3b3a37 hover</span></div>
      <div class="sw"><div class="big" style="background:var(--bg-in)"></div><span class="name">--bg-in</span><span class="hex">#141413 sunken</span></div>
    </div>
  </div></div>
</div>
</body></html>
