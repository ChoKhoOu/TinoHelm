<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.wrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--font-u);font-size:.75rem;font-weight:500;padding:.45rem 1rem;border-radius:var(--rs);border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem}
.p{background:var(--acc);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(217,120,87,.15)}
.s{background:var(--bg-t);color:var(--t0);border-color:var(--bd)}
.g{background:transparent;color:var(--t1)}
.d{background:var(--dan-d);color:var(--dan);border-color:rgba(254,129,129,.2)}
.o{background:transparent;color:var(--t1);border-color:var(--bd)}
.sm{font-size:.68rem;padding:.3rem .6rem}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="wrap">
      <button class="btn p">新建策略</button>
      <button class="btn s">取消</button>
      <button class="btn g">查看</button>
      <button class="btn d">◼ 停止</button>
      <button class="btn o">⏸ 暂停</button>
    </div>
    <div class="wrap">
      <button class="btn p sm">确认</button>
      <button class="btn s sm">返回</button>
      <button class="btn g sm">复制</button>
      <button class="btn d sm">✕ 删除</button>
    </div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="wrap">
      <button class="btn p">新建策略</button>
      <button class="btn s">取消</button>
      <button class="btn g">查看</button>
      <button class="btn d">◼ 停止</button>
      <button class="btn o">⏸ 暂停</button>
    </div>
    <div class="wrap">
      <button class="btn p sm">确认</button>
      <button class="btn s sm">返回</button>
      <button class="btn g sm">复制</button>
      <button class="btn d sm">✕ 删除</button>
    </div>
  </div></div>
</div>
</body></html>
