<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.fg{display:flex;flex-direction:column;gap:4px}
.lbl{font-family:var(--font-d);font-size:.58rem;color:var(--t2)}
.i{font-family:var(--font-d);font-size:.72rem;padding:.5rem .75rem;background:var(--bg-in);border:1px solid var(--bd);border-radius:var(--rs);color:var(--t0);width:100%;box-sizing:border-box;outline:none}
.err{border-color:var(--dan)!important;box-shadow:0 0 0 3px var(--dan-d)!important}
.focus{border-color:var(--acc)!important;box-shadow:0 0 0 3px var(--acc-d)!important}
.hint{font-family:var(--font-d);font-size:.55rem;color:var(--t3)}
.hint.e{color:var(--dan)}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="fg"><span class="lbl">策略名称</span><input class="i" value="ma_cross_v2"></div>
    <div class="fg"><span class="lbl">Symbol · focus</span><input class="i focus" value="BTCUSDT-PERP"><span class="hint">Press Enter to search</span></div>
    <div class="fg"><span class="lbl">初始资金 · error</span><input class="i err" value="-1000"><span class="hint e">必须大于 0</span></div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="fg"><span class="lbl">策略名称</span><input class="i" value="ma_cross_v2"></div>
    <div class="fg"><span class="lbl">Symbol · focus</span><input class="i focus" value="BTCUSDT-PERP"><span class="hint">Press Enter to search</span></div>
    <div class="fg"><span class="lbl">初始资金 · error</span><input class="i err" value="-1000"><span class="hint e">必须大于 0</span></div>
  </div></div>
</div>
</body></html>
