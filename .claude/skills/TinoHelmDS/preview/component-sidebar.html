<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.pane{padding:0;display:flex}
.sb{width:100%;background:var(--bg-in);display:flex;flex-direction:column;padding:14px 8px;gap:2px}
.logo{font-family:var(--font-d);font-size:.85rem;font-weight:600;color:var(--t0);padding:6px 10px;margin-bottom:6px}
.g{font-family:var(--font-d);font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:8px 10px 4px}
.it{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--rs);border-left:3px solid transparent;font-size:.72rem;color:var(--t1);font-family:var(--font-u)}
.it.a{color:var(--acc);border-left-color:var(--acc);background:var(--acc-d)}
.ico{width:13px;height:13px;border:1.5px solid currentColor;border-radius:3px;opacity:.7}
.it.a .ico{opacity:1}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT">
    <div class="sb">
      <div class="logo"><span style="color:var(--acc)">T</span>ino<span style="color:var(--acc)">.</span>Helm</div>
      <div class="g">Core</div>
      <div class="it a"><span class="ico"></span>Dashboard</div>
      <div class="it"><span class="ico"></span>Backtests</div>
      <div class="it"><span class="ico"></span>Factor Research</div>
      <div class="g">Trading</div>
      <div class="it"><span class="ico"></span>Terminal</div>
      <div class="it"><span class="ico"></span>Strategies</div>
    </div>
  </div>
  <div class="pane theme-dark" data-label="DARK">
    <div class="sb">
      <div class="logo"><span style="color:var(--acc)">T</span>ino<span style="color:var(--acc)">.</span>Helm</div>
      <div class="g">Core</div>
      <div class="it a"><span class="ico"></span>Dashboard</div>
      <div class="it"><span class="ico"></span>Backtests</div>
      <div class="it"><span class="ico"></span>Factor Research</div>
      <div class="g">Trading</div>
      <div class="it"><span class="ico"></span>Terminal</div>
      <div class="it"><span class="ico"></span>Strategies</div>
    </div>
  </div>
</div>
</body></html>
