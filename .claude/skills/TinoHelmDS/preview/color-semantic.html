<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.sem-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sem{border:1px solid var(--bd);border-radius:var(--rs);padding:10px;background:var(--bg-p)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dot{width:12px;height:12px;border-radius:50%}
.name{font-family:var(--font-d);font-size:.66rem;color:var(--t0);font-weight:600}
.hex{font-family:var(--font-d);font-size:.54rem;color:var(--t2)}
.fill{margin-top:5px;padding:3px 8px;border-radius:100px;font-family:var(--font-d);font-size:.58rem;display:inline-block}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="sem-grid">
      <div class="sem"><div class="top"><div class="dot" style="background:var(--suc)"></div><span class="name">success</span></div><div class="hex">#36884B</div><div class="fill" style="background:var(--suc-d);color:var(--suc)">+12.4%</div></div>
      <div class="sem"><div class="top"><div class="dot" style="background:var(--dan)"></div><span class="name">danger</span></div><div class="hex">#8A2425</div><div class="fill" style="background:var(--dan-d);color:var(--dan)">−3.8%</div></div>
      <div class="sem"><div class="top"><div class="dot" style="background:var(--info)"></div><span class="name">info</span></div><div class="hex">#3266AD</div><div class="fill" style="background:var(--info-d);color:var(--info)">Running</div></div>
      <div class="sem"><div class="top"><div class="dot" style="background:var(--warn)"></div><span class="name">warning</span></div><div class="hex">#854F0B</div><div class="fill" style="background:var(--warn-d);color:var(--warn)">Stale</div></div>
    </div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="sem-grid">
      <div class="sem"><div class="top"><div class="dot" style="background:var(--suc)"></div><span class="name">success</span></div><div class="hex">#36884B</div><div class="fill" style="background:var(--suc-d);color:var(--suc)">+12.4%</div></div>
      <div class="sem"><div class="top"><div class="dot" style="background:var(--dan)"></div><span class="name">danger</span></div><div class="hex">#FE8181</div><div class="fill" style="background:var(--dan-d);color:var(--dan)">−3.8%</div></div>
      <div class="sem"><div class="top"><div class="dot" style="background:var(--info)"></div><span class="name">info</span></div><div class="hex">#85B7EB</div><div class="fill" style="background:var(--info-d);color:var(--info)">Running</div></div>
      <div class="sem"><div class="top"><div class="dot" style="background:var(--warn)"></div><span class="name">warning</span></div><div class="hex">#FAC775</div><div class="fill" style="background:var(--warn-d);color:var(--warn)">Stale</div></div>
    </div>
  </div></div>
</div>
</body></html>
