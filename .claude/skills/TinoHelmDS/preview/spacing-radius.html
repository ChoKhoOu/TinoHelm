<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.r{display:flex;flex-direction:column;align-items:center;gap:5px}
.box{background:var(--bg-p);border:1px solid var(--bdh);width:64px;height:48px}
.lbl{font-family:var(--font-d);font-size:.56rem;color:var(--t2)}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="row">
      <div class="r"><div class="box" style="border-radius:4px"></div><span class="lbl">4px</span></div>
      <div class="r"><div class="box" style="border-radius:var(--rs)"></div><span class="lbl">--rs 6</span></div>
      <div class="r"><div class="box" style="border-radius:var(--rm)"></div><span class="lbl">--rm 10</span></div>
      <div class="r"><div class="box" style="border-radius:var(--r)"></div><span class="lbl">--r 12</span></div>
      <div class="r"><div class="box" style="border-radius:14px"></div><span class="lbl">14 dialog</span></div>
      <div class="r"><div class="box" style="border-radius:100px;width:80px"></div><span class="lbl">pill</span></div>
    </div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="row">
      <div class="r"><div class="box" style="border-radius:4px"></div><span class="lbl">4px</span></div>
      <div class="r"><div class="box" style="border-radius:var(--rs)"></div><span class="lbl">--rs 6</span></div>
      <div class="r"><div class="box" style="border-radius:var(--rm)"></div><span class="lbl">--rm 10</span></div>
      <div class="r"><div class="box" style="border-radius:var(--r)"></div><span class="lbl">--r 12</span></div>
      <div class="r"><div class="box" style="border-radius:14px"></div><span class="lbl">14 dialog</span></div>
      <div class="r"><div class="box" style="border-radius:100px;width:80px"></div><span class="lbl">pill</span></div>
    </div>
  </div></div>
</div>
</body></html>
