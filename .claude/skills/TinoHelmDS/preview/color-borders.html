<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.box{background:var(--bg-p);border-radius:var(--rs);padding:12px;font-family:var(--font-d);font-size:.62rem;color:var(--t0);display:flex;flex-direction:column;gap:4px}
.hx{color:var(--t3);font-size:.54rem}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="grid">
      <div class="box" style="border:1px solid var(--bd)">--bd default<span class="hx">#dedbd3</span></div>
      <div class="box" style="border:1px solid var(--bdh)">--bdh hover<span class="hx">#c7c4bb</span></div>
      <div class="box" style="border:1px solid var(--bds)">--bds strong<span class="hx">#B0ADA5</span></div>
      <div class="box" style="border:1px solid var(--acc);box-shadow:0 0 0 3px var(--acc-d)"><span style="color:var(--acc)">focus · --acc</span><span class="hx">+3px --acc-d ring</span></div>
    </div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="grid">
      <div class="box" style="border:1px solid var(--bd)">--bd default<span class="hx">#3b3a37</span></div>
      <div class="box" style="border:1px solid var(--bdh)">--bdh hover<span class="hx">#5F5E5A</span></div>
      <div class="box" style="border:1px solid var(--bds)">--bds strong<span class="hx">#73726C</span></div>
      <div class="box" style="border:1px solid var(--acc);box-shadow:0 0 0 3px var(--acc-d)"><span style="color:var(--acc)">focus · --acc</span><span class="hx">+3px --acc-d ring</span></div>
    </div>
  </div></div>
</div>
</body></html>
