<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
.ig{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.it{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--t1)}
.it svg{width:17px;height:17px}
.nm{font-family:var(--font-d);font-size:.5rem;color:var(--t3)}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="ig">
      <div class="it"><i data-lucide="layout-dashboard"></i><span class="nm">dashboard</span></div>
      <div class="it"><i data-lucide="flask-conical"></i><span class="nm">backtest</span></div>
      <div class="it"><i data-lucide="activity"></i><span class="nm">trading</span></div>
      <div class="it"><i data-lucide="brain"></i><span class="nm">strategy</span></div>
      <div class="it"><i data-lucide="database"></i><span class="nm">data</span></div>
      <div class="it"><i data-lucide="bar-chart-3"></i><span class="nm">analytics</span></div>
      <div class="it"><i data-lucide="hexagon"></i><span class="nm">factor</span></div>
      <div class="it"><i data-lucide="wallet"></i><span class="nm">wallet</span></div>
      <div class="it"><i data-lucide="trending-up"></i><span class="nm">pnl</span></div>
      <div class="it"><i data-lucide="server"></i><span class="nm">node</span></div>
    </div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="ig">
      <div class="it"><i data-lucide="layout-dashboard"></i><span class="nm">dashboard</span></div>
      <div class="it"><i data-lucide="flask-conical"></i><span class="nm">backtest</span></div>
      <div class="it"><i data-lucide="activity"></i><span class="nm">trading</span></div>
      <div class="it"><i data-lucide="brain"></i><span class="nm">strategy</span></div>
      <div class="it"><i data-lucide="database"></i><span class="nm">data</span></div>
      <div class="it"><i data-lucide="bar-chart-3"></i><span class="nm">analytics</span></div>
      <div class="it"><i data-lucide="hexagon"></i><span class="nm">factor</span></div>
      <div class="it"><i data-lucide="wallet"></i><span class="nm">wallet</span></div>
      <div class="it"><i data-lucide="trending-up"></i><span class="nm">pnl</span></div>
      <div class="it"><i data-lucide="server"></i><span class="nm">node</span></div>
    </div>
  </div></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
