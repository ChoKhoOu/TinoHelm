<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_split.css">
<style>
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.s{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{background:var(--bg-p);border:1px solid var(--bd);width:100%;height:48px;border-radius:var(--r)}
.lbl{font-family:var(--font-d);font-size:.52rem;color:var(--t2);text-align:center}
</style>
</head><body>
<div class="split">
  <div class="pane theme-light" data-label="LIGHT"><div class="pane-inner">
    <div class="grid">
      <div class="s"><div class="box"></div><span class="lbl">none</span></div>
      <div class="s"><div class="box" style="box-shadow:0 2px 8px rgba(217,120,87,.15)"></div><span class="lbl">btn primary</span></div>
      <div class="s"><div class="box" style="box-shadow:0 8px 30px rgba(0,0,0,.08)"></div><span class="lbl">card hover</span></div>
      <div class="s"><div class="box" style="box-shadow:0 12px 40px rgba(0,0,0,.12)"></div><span class="lbl">dropdown</span></div>
      <div class="s"><div class="box" style="box-shadow:0 24px 80px rgba(0,0,0,.18)"></div><span class="lbl">dialog</span></div>
    </div>
  </div></div>
  <div class="pane theme-dark" data-label="DARK"><div class="pane-inner">
    <div class="grid">
      <div class="s"><div class="box"></div><span class="lbl">none</span></div>
      <div class="s"><div class="box" style="box-shadow:0 2px 8px rgba(217,120,87,.15)"></div><span class="lbl">btn primary</span></div>
      <div class="s"><div class="box" style="box-shadow:0 8px 30px rgba(0,0,0,.1)"></div><span class="lbl">card hover</span></div>
      <div class="s"><div class="box" style="box-shadow:0 12px 40px rgba(0,0,0,.15)"></div><span class="lbl">dropdown</span></div>
      <div class="s"><div class="box" style="box-shadow:0 24px 80px rgba(0,0,0,.2)"></div><span class="lbl">dialog</span></div>
    </div>
  </div></div>
</div>
</body></html>
