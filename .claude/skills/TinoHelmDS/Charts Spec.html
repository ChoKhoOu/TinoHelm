<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="utf-8">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<style>
body { margin: 0; background: var(--bg-s); color: var(--t0); font-family: var(--font-u); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 48px 40px 96px; }
.hero { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 28px; border-bottom: 1px solid var(--bd); margin-bottom: 40px; }
.brand { font-family: var(--font-d); font-weight: 600; font-size: 1.7rem; letter-spacing: -.02em; }
.brand .a { color: var(--acc); }
.sub { color: var(--t2); font-family: var(--font-d); font-size: .7rem; margin-top: 6px; }
.mode-toggle { display: inline-flex; background: var(--bg-in); border-radius: var(--rs); padding: 3px; gap: 2px; border: 1px solid var(--bd); }
.mode-toggle button { font-family: var(--font-d); font-size: .7rem; padding: .4rem .85rem; border-radius: 4px; border: none; background: transparent; color: var(--t2); cursor: pointer; }
.mode-toggle button.active { background: var(--bg-t); color: var(--t0); }

.anchors { position: sticky; top: 0; background: var(--bg-s); z-index: 10; padding: 14px 0; border-bottom: 1px solid var(--bd); margin-bottom: 36px; display: flex; gap: 4px; flex-wrap: wrap; }
.anchors a { font-family: var(--font-d); font-size: .68rem; padding: .35rem .7rem; border-radius: var(--rs); color: var(--t2); text-decoration: none; }
.anchors a:hover { background: var(--bg-t); color: var(--t0); }

.section { margin-bottom: 64px; }
.section h2 { font-family: var(--font-d); font-size: 1.3rem; font-weight: 600; margin: 0 0 6px 0; letter-spacing: -.02em; }
.section .desc { color: var(--t2); font-size: .85rem; margin-bottom: 20px; max-width: 720px; }

.chart-card { background: var(--bg-p); border: 1px solid var(--bd); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.chart-head { display: flex; justify-content: space-between; align-items: center; }
.chart-title { font-family: var(--font-d); font-size: .9rem; font-weight: 600; color: var(--t0); }
.chart-meta { font-family: var(--font-d); font-size: .62rem; color: var(--t3); }
.rules { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px 18px; margin-top: 4px; }
.rules li { font-family: var(--font-d); font-size: .6rem; color: var(--t2); list-style: none; padding-left: 14px; position: relative; }
.rules li::before { content: '·'; color: var(--acc); position: absolute; left: 4px; top: -2px; font-weight: 700; }
.two-col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

/* Recharts overrides */
.recharts-tooltip-wrapper { outline: none; }
.qds-tooltip { background: var(--bg-p); border: 1px solid var(--bdh); border-radius: var(--rs); padding: 8px 10px; font-family: var(--font-d); font-size: .62rem; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
.qds-tooltip .lbl { color: var(--t2); margin-bottom: 4px; }
.qds-tooltip .v { color: var(--t0); }
.qds-tooltip .v .k { color: var(--t2); margin-right: 6px; }

/* Tokens table */
.tokens-table { width: 100%; border-collapse: collapse; font-family: var(--font-d); font-size: .7rem; }
.tokens-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--bd); color: var(--t3); font-weight: 500; font-size: .56rem; letter-spacing: .12em; text-transform: uppercase; }
.tokens-table td { padding: 8px 10px; border-bottom: 1px solid var(--bd); color: var(--t1); }
.tokens-table td code { color: var(--acc); font-family: var(--font-d); font-size: .66rem; }
.tokens-table .sw { width: 20px; height: 20px; border-radius: 4px; display: inline-block; vertical-align: middle; margin-right: 8px; border: 1px solid var(--bd); }

.code-block { background: var(--bg-in); border: 1px solid var(--bd); border-radius: var(--rs); padding: 14px 16px; font-family: var(--font-d); font-size: .68rem; color: var(--t1); overflow-x: auto; white-space: pre; line-height: 1.55; }
.code-block .c { color: var(--t3); }
.code-block .k { color: var(--acc); }
.code-block .s { color: var(--suc); }

.grp { font-family: var(--font-d); font-size: .56rem; letter-spacing: .15em; text-transform: uppercase; color: var(--acc); display: flex; align-items: center; gap: .5rem; margin: 40px 0 14px; }
.grp::after { content: ''; flex: 1; height: 1px; background: var(--bd); }

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;
const R = Recharts;
const {
  ResponsiveContainer, LineChart, Line, AreaChart, Area, BarChart, Bar, ScatterChart, Scatter,
  ComposedChart, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ReferenceLine, ReferenceArea,
  Cell, ZAxis, LabelList
} = R;

// ---- Token literals (avoid getComputedStyle timing issues across theme flips) ----
const LIGHT_TOKENS = {
  acc: '#D97857', suc: '#36884B', dan: '#8A2425', info: '#3266AD', warn: '#854F0B',
  t0: '#2c2c2a', t1: '#4a4846', t2: '#6e6a64', t3: '#9a938a',
  bd: '#dedbd3', bdh: '#c9c4b8',
  bgP: '#fbf9f3', bgIn: '#f2ede2',
  grid: 'rgba(0,0,0,.05)', tick: 'rgba(44,44,42,.6)',
};
const DARK_TOKENS = {
  acc: '#D97857', suc: '#36884B', dan: '#FE8181', info: '#85B7EB', warn: '#FAC775',
  t0: '#E8E6E0', t1: '#C4C0B6', t2: '#8E8A7F', t3: '#6A665E',
  bd: '#3b3a37', bdh: '#4f4d49',
  bgP: '#262624', bgIn: '#1d1d1b',
  grid: 'rgba(255,255,255,.05)', tick: 'rgba(232,230,224,.55)',
};
function useTokens(dark) {
  return dark ? DARK_TOKENS : LIGHT_TOKENS;
}

// ---- Shared chart axis defaults ----
function gridProps(T) {
  return {
    stroke: T.grid,
    strokeDasharray: '0',
    vertical: false,
  };
}
function axisProps(T, extra = {}) {
  return {
    stroke: T.bd,
    tick: { fill: T.tick, fontSize: 10, fontFamily: 'JetBrains Mono' },
    tickLine: false,
    axisLine: { stroke: T.bd },
    ...extra,
  };
}
function QDSTooltip({ active, payload, label, valueFormatter, labelFormatter }) {
  if (!active || !payload || !payload.length) return null;
  const fmt = valueFormatter || ((v) => v);
  return (
    <div className="qds-tooltip">
      <div className="lbl">{labelFormatter ? labelFormatter(label) : label}</div>
      {payload.map((p, i) => (
        <div className="v" key={i}><span className="k" style={{color: p.color || p.stroke}}>{p.name}</span>{fmt(p.value, p)}</div>
      ))}
    </div>
  );
}

// ============= Data generators =============
function seededRng(seed) { let s = seed; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function equitySeries(n = 120, seed = 7) {
  const r = seededRng(seed); let v = 1000000; const out = [];
  for (let i = 0; i < n; i++) {
    const drift = 0.0008 + (r() - 0.5) * 0.022;
    v *= (1 + drift);
    const d = new Date(2025, 0, 1); d.setDate(d.getDate() + i);
    out.push({ t: `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, equity: Math.round(v) });
  }
  // derive drawdown
  let peak = -Infinity;
  return out.map(d => { peak = Math.max(peak, d.equity); return { ...d, dd: (d.equity - peak) / peak * 100 }; });
}
function ohlcSeries(n = 60, seed = 21) {
  const r = seededRng(seed); let p = 42000; const out = [];
  for (let i = 0; i < n; i++) {
    const vol = p * 0.012;
    const o = p;
    const c = o + (r() - 0.48) * vol * 1.6;
    const h = Math.max(o, c) + r() * vol * 0.7;
    const l = Math.min(o, c) - r() * vol * 0.7;
    const v = Math.round(800 + r() * 1400);
    p = c;
    out.push({ i, o: +o.toFixed(1), h: +h.toFixed(1), l: +l.toFixed(1), c: +c.toFixed(1), v, up: c >= o });
  }
  return out;
}
function histogram(bins = 24, seed = 5) {
  const r = seededRng(seed); const arr = [];
  for (let i = 0; i < 2500; i++) {
    // sum-of-12 ≈ normal, mean 0, std ~1
    let s = 0; for (let k = 0; k < 12; k++) s += r();
    arr.push((s - 6) * 0.9 + 0.08);
  }
  const min = -3.2, max = 3.2, w = (max - min) / bins;
  const counts = Array(bins).fill(0);
  arr.forEach(v => { const idx = Math.min(bins - 1, Math.max(0, Math.floor((v - min) / w))); counts[idx]++; });
  return counts.map((c, i) => ({ bin: +(min + w * i + w / 2).toFixed(2), count: c }));
}
function qqPoints(n = 80, seed = 9) {
  const r = seededRng(seed); const vals = [];
  for (let i = 0; i < n; i++) {
    let s = 0; for (let k = 0; k < 12; k++) s += r();
    vals.push((s - 6) / Math.sqrt(1)); // standard normal-ish
  }
  vals.sort((a, b) => a - b);
  // add mild fat-tail skew to show deviation
  const skewed = vals.map((v, i) => v + Math.sign(v) * Math.pow(Math.abs(v), 2.2) * 0.06);
  // theoretical quantiles via approximate inverse normal
  const erfInv = (x) => { const a = 0.147; const ln = Math.log(1 - x * x); const t = 2/(Math.PI*a) + ln/2; return Math.sign(x) * Math.sqrt(Math.sqrt(t*t - ln/a) - t); };
  return skewed.map((v, i) => {
    const p = (i + 0.5) / n;
    const theoretical = Math.SQRT2 * erfInv(2 * p - 1);
    return { theoretical: +theoretical.toFixed(3), sample: +v.toFixed(3) };
  });
}
function scatterPoints(n = 90, seed = 3) {
  const r = seededRng(seed); const pts = [];
  for (let i = 0; i < n; i++) {
    const x = (r() - 0.5) * 4;
    const noise = (r() - 0.5) * 0.8;
    const y = 0.6 * x + noise;
    const size = 6 + r() * 14;
    pts.push({ x: +x.toFixed(2), y: +y.toFixed(2), z: +size.toFixed(1), tag: ['BTC','ETH','SOL','AVAX'][Math.floor(r()*4)] });
  }
  return pts;
}
function corrMatrix() {
  const syms = ['BTC','ETH','SOL','AVAX','LINK','DOGE','ADA','GOLD'];
  // Latent factor per asset — mostly +, two explicitly negative (GOLD, DOGE)
  // ensures the diverging scale actually shows red cells.
  const factor = { BTC:.9, ETH:.85, SOL:.75, AVAX:.7, LINK:.6, DOGE:-.35, ADA:.55, GOLD:-.6 };
  const r = seededRng(12);
  return syms.map((a) => syms.map((b) => {
    if (a === b) return { x: b, y: a, v: 1 };
    const v = Math.max(-0.9, Math.min(0.95, factor[a]*factor[b] + (r()-0.5)*0.2));
    return { x: b, y: a, v: +v.toFixed(2) };
  }));
}
function rollingSeries(n = 180, seed = 2) {
  const r = seededRng(seed); let s = 1.3, b = 0.85; const out = [];
  for (let i = 0; i < n; i++) {
    s += (r() - 0.5) * 0.08; b += (r() - 0.5) * 0.04;
    s = Math.max(-0.5, Math.min(3.0, s));
    b = Math.max(0.2, Math.min(1.6, b));
    out.push({ i, sharpe: +s.toFixed(2), beta: +b.toFixed(2) });
  }
  return out;
}
function pnlCalendar() {
  const r = seededRng(17); const weeks = 26, days = 7; const out = [];
  for (let w = 0; w < weeks; w++) {
    for (let d = 0; d < days; d++) {
      const v = +((r() - 0.45) * 6).toFixed(2);
      out.push({ w, d, v });
    }
  }
  return out;
}
function orderBook() {
  const mid = 42180; const rows = 22; const r = seededRng(31);
  const bids = []; const asks = [];
  let cumB = 0, cumA = 0;
  for (let i = 0; i < rows; i++) {
    const sizeB = +(4 + r() * 6).toFixed(2); cumB += sizeB;
    const sizeA = +(4 + r() * 6).toFixed(2); cumA += sizeA;
    bids.push({ price: +(mid - (i+1) * 4).toFixed(1), size: sizeB, cum: +cumB.toFixed(2) });
    asks.push({ price: +(mid + (i+1) * 4).toFixed(1), size: sizeA, cum: +cumA.toFixed(2) });
  }
  return { bids: bids.reverse(), asks };
}
function tickTrail(n = 60) {
  const r = seededRng(41); let p = 42180; const out = [];
  for (let i = 0; i < n; i++) {
    const dir = r() > 0.5 ? 1 : -1;
    p += dir * (0.5 + r() * 2);
    out.push({ i, price: +p.toFixed(1), dir });
  }
  return out;
}
function ranking(n = 9, seed = 61) {
  const r = seededRng(seed);
  const names = ['ma_cross_v2','rsi_momentum','mean_rev_alpha','vol_breakout_v3','pair_btc_eth','carry_arb','factor_mix','news_nlp','xgb_signal_4h'];
  return names.slice(0, n).map(n => ({ name: n, sharpe: +((r()*3) - 0.3).toFixed(2) })).sort((a,b) => b.sharpe - a.sharpe);
}
function spreadSeries(n = 140, seed = 11) {
  const r = seededRng(seed); let a = 100, b = 100; const out = [];
  for (let i = 0; i < n; i++) {
    a += (r() - 0.5) * 1.2 + Math.sin(i/12)*0.4;
    b += (r() - 0.5) * 1.15 + Math.sin(i/12 + 0.5)*0.38;
    out.push({ i, a: +a.toFixed(2), b: +b.toFixed(2), spread: +(a - b).toFixed(2) });
  }
  return out;
}

// ============= Candlestick custom shape =============
// (Recharts has no candlestick natively; render via Bar dataKey="hl" + custom shape.)
function Candle({ x, y, width, height, payload, tokens }) {
  const { o, h, l, c, up } = payload;
  const color = up ? tokens.suc : tokens.dan;
  const hlStroke = color;
  // y/height passed by Bar correspond to the hl range (we set data-driven hl=[l,h])
  // We need to compute pixel positions from domain — easier: use coordinate from props (y is top of bar range, height covers the whole [l..h])
  const centerX = x + width / 2;
  // body corresponds to the open-close rect
  const highY = y;
  const lowY = y + height;
  const range = h - l; // value range mapped by Recharts
  const openRatio = (h - o) / range;
  const closeRatio = (h - c) / range;
  const bodyTop = highY + openRatio * height;
  const bodyBot = highY + closeRatio * height;
  const bodyTopPx = Math.min(bodyTop, bodyBot);
  const bodyHeight = Math.max(1, Math.abs(bodyBot - bodyTop));
  const wickX = centerX;
  const bodyX = x + 1.5;
  const bodyW = Math.max(1, width - 3);
  return (
    <g>
      <line x1={wickX} x2={wickX} y1={highY} y2={lowY} stroke={hlStroke} strokeWidth={1} />
      <rect x={bodyX} y={bodyTopPx} width={bodyW} height={bodyHeight} fill={up ? color : color} opacity={up ? 1 : 1} />
    </g>
  );
}

// ============= Chart card wrapper =============
function ChartCard({ title, meta, rules, height = 260, children }) {
  return (
    <div className="chart-card">
      <div className="chart-head">
        <div>
          <div className="chart-title">{title}</div>
          {meta && <div className="chart-meta" style={{marginTop:3}}>{meta}</div>}
        </div>
      </div>
      <div style={{width:'100%', height}}>
        <ResponsiveContainer>{children}</ResponsiveContainer>
      </div>
      {rules && (<ul className="rules">{rules.map((r, i) => <li key={i}>{r}</li>)}</ul>)}
    </div>
  );
}

function App() {
  const [dark, setDark] = useState(false);
  React.useEffect(() => {
    document.documentElement.classList.toggle('light', !dark);
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);
  const T = useTokens(dark);

  // Data
  const eq = useMemo(() => equitySeries(120, 7), []);
  const ohlc = useMemo(() => ohlcSeries(48, 21), []);
  const ohlcBar = useMemo(() => ohlc.map(d => ({ ...d, hl: [d.l, d.h] })), [ohlc]);
  const hist = useMemo(() => histogram(26, 5), []);
  const qq = useMemo(() => qqPoints(80, 9), []);
  const sc = useMemo(() => scatterPoints(90, 3), []);
  const corr = useMemo(() => corrMatrix(), []);
  const rolling = useMemo(() => rollingSeries(180, 2), []);
  const cal = useMemo(() => pnlCalendar(), []);
  const ob = useMemo(() => orderBook(), []);
  const tt = useMemo(() => tickTrail(60), []);
  const rk = useMemo(() => ranking(9), []);
  const sp = useMemo(() => spreadSeries(140, 11), []);

  const fmtMoney = (v) => '$' + Math.round(v).toLocaleString();
  const fmtPct = (v) => (v>0?'+':'') + v.toFixed(2) + '%';

  return (
    <div className="wrap">
      <div className="hero">
        <div>
          <div className="brand"><span className="a">T</span>ino<span className="a">.</span>Helm · <span style={{color:'var(--t2)',fontWeight:400}}>Charts Spec</span></div>
          <div className="sub">Quantitative chart vocabulary · Recharts 2.x · QDS Warm tokens · green up / red down · data-first, chrome-minimal</div>
        </div>
        <div className="mode-toggle">
          <button className={!dark ? 'active' : ''} onClick={() => setDark(false)}>Light</button>
          <button className={dark ? 'active' : ''} onClick={() => setDark(true)}>Dark</button>
        </div>
      </div>

      <nav className="anchors">
        <a href="#principles">Principles</a>
        <a href="#tokens">Tokens</a>
        <a href="#market">Market</a>
        <a href="#perf">Performance</a>
        <a href="#research">Research</a>
        <a href="#micro">Microstructure</a>
        <a href="#ranking">Ranking</a>
        <a href="#snippets">Recharts snippets</a>
      </nav>

      {/* ================ PRINCIPLES ================ */}
      <section className="section" id="principles">
        <h2>Principles</h2>
        <div className="desc">Every chart in TinoHelm follows the same ten rules. If you remember nothing else, remember these.</div>
        <div className="chart-card">
          <ol style={{margin:0,paddingLeft:18,fontFamily:'var(--font-d)',fontSize:'.72rem',lineHeight:1.8,color:'var(--t1)',columns:2,columnGap:32}}>
            <li><b>Monospaced tick labels.</b> Always. <code style={{color:'var(--acc)'}}>fontFamily: 'JetBrains Mono', fontSize: 10, fill: var(--chart-tick)</code></li>
            <li><b>No axis line on top/right.</b> Only bottom (X) and left (Y). Use <code style={{color:'var(--acc)'}}>axisLine={'{'}{'{'} stroke: 'var(--bd)' {'}'}{'}'}, tickLine={'{'}false{'}'}</code></li>
            <li><b>Horizontal grid only.</b> No vertical grid — time already implies vertical structure. <code style={{color:'var(--acc)'}}>{'<CartesianGrid vertical={false} stroke="var(--chart-grid)" strokeDasharray="0" />'}</code></li>
            <li><b>Grid is whisper-faint.</b> <code style={{color:'var(--acc)'}}>rgba(255,255,255,.05)</code> dark / <code style={{color:'var(--acc)'}}>rgba(0,0,0,.05)</code> light. Data, not chrome, carries the eye.</li>
            <li><b>One primary color per chart.</b> Use <code style={{color:'var(--acc)'}}>--acc</code>. Semantic greens/reds are reserved for up/down, gain/loss, done/failed.</li>
            <li><b>Gradients are rare.</b> Only the equity/drawdown area fill. 25% alpha at top → 0% at bottom.</li>
            <li><b>Tooltip is a card.</b> Same <code style={{color:'var(--acc)'}}>--bg-p</code> + <code style={{color:'var(--acc)'}}>--bdh</code> border + 6px radius as all other cards. No arrows, no custom shadows.</li>
            <li><b>Dots off by default.</b> <code style={{color:'var(--acc)'}}>dot={'{'}false{'}'}</code>. Only show dots on hover (<code style={{color:'var(--acc)'}}>activeDot</code>).</li>
            <li><b>Candlestick: green up / red down</b> — <code style={{color:'var(--acc)'}}>--suc</code> / <code style={{color:'var(--acc)'}}>--dan</code>. Western convention.</li>
            <li><b>Reference lines are dashed accent.</b> <code style={{color:'var(--acc)'}}>stroke="var(--acc)" strokeDasharray="4 3"</code> for entry/exit, means, thresholds.</li>
          </ol>
        </div>
      </section>

      {/* ================ TOKENS ================ */}
      <section className="section" id="tokens">
        <h2>Color tokens for charts</h2>
        <div className="desc">These are the only colors a chart should use. The data dimension ("what is this series?") drives the token — never pick a hue for prettiness.</div>
        <div className="chart-card" style={{padding:0}}>
          <table className="tokens-table">
            <thead><tr><th>Token</th><th>Hex (dark)</th><th>Hex (light)</th><th>Use</th></tr></thead>
            <tbody>
              <tr><td><span className="sw" style={{background:'var(--acc)'}}></span><code>--acc</code></td><td>#D97857</td><td>#D97857</td><td>Primary line / area / bar; reference lines (dashed)</td></tr>
              <tr><td><span className="sw" style={{background:'var(--suc)'}}></span><code>--suc</code></td><td>#36884B</td><td>#36884B</td><td>Up candles, positive returns, gains, filled orders</td></tr>

// Calendar heatmap (custom SVG, simple & aligned with QDS)
function CalendarHeatmap({ data, T }) {
  const weeks = Math.max(...data.map(d => d.w)) + 1;
  const cell = 14, gap = 2, padL = 28, padT = 14;
  const absMax = Math.max(...data.map(d => Math.abs(d.v))) * 0.9 || 1;
  const dayLabels = ['M','T','W','T','F','S','S'];
  return (
    <svg width="100%" height="100%" viewBox={`0 0 ${padL + weeks*(cell+gap)} ${padT + 7*(cell+gap) + 12}`}>
      {dayLabels.map((l,i)=> (
        <text key={i} x={padL-6} y={padT + i*(cell+gap) + cell*0.8} textAnchor="end" fill={T.t3} fontFamily="JetBrains Mono" fontSize="8">{l}</text>
      ))}
      {data.map((d,i) => {
        const a = Math.min(1, Math.abs(d.v) / absMax);
        const fill = Math.abs(d.v) < 0.05 ? T.bdh : (d.v > 0 ? T.suc : T.dan);
        return (
          <rect key={i}
            x={padL + d.w * (cell+gap)}
            y={padT + d.d * (cell+gap)}
            width={cell} height={cell} rx="2"
            fill={fill} fillOpacity={Math.abs(d.v)<0.05 ? 0.15 : 0.15 + a*0.75}>
            <title>{`week ${d.w+1} · ${dayLabels[d.d]} · ${d.v>0?'+':''}${d.v.toFixed(2)}%`}</title>
          </rect>
        );
      })}
      <g transform={`translate(${padL}, ${padT + 7*(cell+gap) + 4})`}>
        <text x={0} y={6} fill={T.t3} fontFamily="JetBrains Mono" fontSize="8">less</text>
        {[0.2,0.4,0.6,0.8,1].map((v,i)=>(
          <rect key={i} x={22 + i*12} y={0} width={10} height={8} rx="1" fill={T.suc} fillOpacity={0.15 + v*0.75}/>
        ))}
        <text x={22 + 5*12 + 4} y={6} fill={T.t3} fontFamily="JetBrains Mono" fontSize="8">more</text>
      </g>
    </svg>
  );
}

function CorrHeat({ data, T }) {
  const syms = data.map(row => row[0].y); // labels
  const n = syms.length;
  const cell = 48, ch = 28, gap = 1, padL = 56, padT = 24;
  const W = padL + n * (cell + gap);
  const H = padT + n * (ch + gap) + 14;
  const colorFor = (v) => {
    if (v > 0) return T.suc;
    if (v < 0) return T.dan;
    return T.bdh;
  };
  return (
    <svg width="100%" height="100%" viewBox={`0 0 ${W} ${H}`}>
      {syms.map((s,i)=>(
        <text key={'x'+i} x={padL + i*(cell+gap) + cell/2} y={padT-8} textAnchor="middle" fill={T.t2} fontFamily="JetBrains Mono" fontSize="10">{s}</text>
      ))}
      {syms.map((s,i)=>(
        <text key={'y'+i} x={padL-8} y={padT + i*(ch+gap) + ch*0.66} textAnchor="end" fill={T.t2} fontFamily="JetBrains Mono" fontSize="10">{s}</text>
      ))}
      {data.flatMap((row,ri)=> row.map((c,ci)=>{
        const diag = ri === ci;
        const fill = diag ? 'transparent' : colorFor(c.v);
        const alpha = diag ? 0 : Math.min(1, Math.abs(c.v));
        return (
          <g key={`${ri}-${ci}`}>
            <rect
              x={padL + ci*(cell+gap)}
              y={padT + ri*(ch+gap)}
              width={cell} height={ch} rx="2"
              fill={fill} fillOpacity={0.12 + alpha*0.55}
              stroke={diag ? T.bd : 'none'}/>
            {Math.abs(c.v)>=0.5 && !diag && (
              <text x={padL + ci*(cell+gap) + cell/2} y={padT + ri*(ch+gap) + ch*0.66}
                    textAnchor="middle" fill={T.t0} fontFamily="JetBrains Mono" fontSize="10">
                {c.v.toFixed(2)}
              </text>
            )}
            {diag && (
              <text x={padL + ci*(cell+gap) + cell/2} y={padT + ri*(ch+gap) + ch*0.66}
                    textAnchor="middle" fill={T.t3} fontFamily="JetBrains Mono" fontSize="10">·</text>
            )}
          </g>
        );
      }))}
    </svg>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
