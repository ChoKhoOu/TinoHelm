[package]
name = "tino"
version = "0.1.0"
edition = "2021"
description = "TinoHelm CLI — LLM-first quantitative trading control plane"

[[bin]]
name = "tino"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
anyhow = "1"

# Config paths
dirs = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
